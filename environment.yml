name: kpn5

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  # Reproduced KPN5 experiments were validated with PyTorch 2.4.1 + CUDA 11.8.
  - python=3.10
  - pip>=23.3
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=11.8

  # Install project and evaluation dependencies through pip so that this file
  # behaves consistently across Linux and Windows Conda installations.
  - pip:
      - configobj==5.0.9
      - numpy==1.26.4
      - opencv-python==4.10.0.84
      - Pillow==10.4.0
      - scipy==1.13.1
      - scikit-image==0.24.0
      - scikit-learn==1.5.2
      - PyWavelets==1.7.0
      - tensorboardX==2.6.2.2
      - tqdm==4.66.5
      - tifffile==2024.9.20
      - rawpy==0.21.0
      - boto3==1.35.24
      - lpips==0.1.4
      - pytorch-fid==0.3.0
      - torchsummary==1.5.1
